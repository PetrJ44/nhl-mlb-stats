<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NHL & MLB Stats</title><link rel="stylesheet" href="style.css"><main><header><h1>NHL & MLB Stats</h1><button id="theme">Světlý / tmavý</button></header><nav><button data-league="nhl">🏒 NHL</button><button data-league="mlb">⚾ MLB</button></nav><section id="filters"><label>Tým<select id="team"></select></label><label>Sezona<select id="season"><option value="current">Aktuální</option><option value="previous">Předchozí</option><option value="both">Obě</option></select></label><label>Období<select id="period"><option value="all">Celá sezona</option><option>5</option><option>10</option><option>20</option><option value="custom">Vlastní data</option></select></label><label>Doma / venku<select id="venue"><option value="all">Vše</option><option value="home">Doma</option><option value="away">Venku</option></select></label><label>Soupeř<select id="opponent"></select></label><label>Od<input type="date" id="from"></label><label>Do<input type="date" id="to"></label></section><p id="status" role="status"></p><div id="metrics"></div><div class="scroll"><table id="table"></table></div><div id="distribution"></div><footer id="updated"></footer><p>Historické četnosti nejsou předpovědí. Pouze základní část.</p></main><script src="app.js?v=2"></script></html>
